<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Faktura VAT — demo formularza</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f3f5f7;
    --card: #ffffff;
    --ink: #14202b;
    --muted: #61707d;
    --line: #dde3e8;
    --brand: #0f6b5c;
    --brand-dark: #0b5347;
    --brand-soft: #e3f2ef;
    --danger: #c0392b;
    --danger-soft: #fbeae8;
    --radius: 10px;
  }

  body {
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 15px;
    line-height: 1.5;
  }

  .page { max-width: 980px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }

  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
  .top h1 { font-size: 1.6rem; font-weight: 600; letter-spacing: -.01em; }
  .top p { color: var(--muted); font-size: 14px; margin-top: .15rem; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 1.5rem; margin-bottom: 1.25rem; }
  .card h2 { font-size: 15px; font-weight: 600; margin-bottom: 1rem; }

  .grid { display: grid; gap: 1rem; }
  .g3 { grid-template-columns: repeat(3, 1fr); }
  .g2 { grid-template-columns: repeat(2, 1fr); }

  .field { display: flex; flex-direction: column; gap: .35rem; min-width: 0; }
  .field label { font-size: 13px; color: var(--muted); font-weight: 500; }
  .field input, .field select {
    font: inherit; color: var(--ink);
    background: #fff; border: 1px solid var(--line); border-radius: 8px;
    padding: .6rem .75rem; width: 100%; min-height: 42px;
    transition: border-color .15s, box-shadow .15s;
  }
  .field input:focus, .field select:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  .field.invalid input { border-color: var(--danger); background: var(--danger-soft); }
  .error { color: var(--danger); font-size: 12.5px; min-height: 0; display: none; }
  .field.invalid .error { display: block; }

  /* ITEMS */
  .items-head, .item {
    display: grid;
    grid-template-columns: minmax(0, 3fr) 80px 120px 90px 120px 40px;
    gap: .75rem; align-items: center;
  }
  .items-head { font-size: 12.5px; color: var(--muted); font-weight: 500; padding: 0 0 .5rem; border-bottom: 1px solid var(--line); }
  .items-head .r, .item .r { text-align: right; }
  .item { padding: .75rem 0; border-bottom: 1px solid var(--line); }
  .item input, .item select {
    font: inherit; color: var(--ink); width: 100%; min-height: 40px;
    border: 1px solid var(--line); border-radius: 8px; padding: .5rem .65rem; background: #fff;
  }
  .item input:focus, .item select:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  .item input.bad { border-color: var(--danger); background: var(--danger-soft); }
  .line-net { font-weight: 500; font-variant-numeric: tabular-nums; text-align: right; }
  .m-label { display: none; }

  .icon-btn {
    width: 36px; height: 36px; border: none; background: none; border-radius: 8px;
    color: var(--muted); font-size: 20px; cursor: pointer; line-height: 1;
  }
  .icon-btn:hover { background: var(--danger-soft); color: var(--danger); }
  .icon-btn:disabled { opacity: .3; cursor: not-allowed; background: none; color: var(--muted); }

  .btn {
    font: inherit; font-weight: 500; cursor: pointer;
    border-radius: 8px; padding: .65rem 1.2rem; min-height: 42px;
    border: 1px solid var(--line); background: #fff; color: var(--ink);
    transition: background .15s, border-color .15s;
  }
  .btn:hover { background: var(--bg); }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  .btn.primary:hover { background: var(--brand-dark); }
  .btn.add { margin-top: 1rem; color: var(--brand); border-style: dashed; border-color: var(--brand); background: transparent; }
  .btn.add:hover { background: var(--brand-soft); }
  .btn:focus-visible, .icon-btn:focus-visible { outline: 3px solid var(--brand-soft); outline-offset: 1px; box-shadow: 0 0 0 1px var(--brand); }

  /* SUMMARY */
  table.sum { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  .sum th { font-size: 12.5px; color: var(--muted); font-weight: 500; text-align: right; padding: .4rem 0; border-bottom: 1px solid var(--line); }
  .sum td { text-align: right; padding: .55rem 0; border-bottom: 1px solid var(--line); }
  .sum th:first-child, .sum td:first-child { text-align: left; }
  .sum tr.total td { font-weight: 600; font-size: 1.05rem; border-bottom: none; padding-top: .85rem; }
  .sum .empty td { color: var(--muted); text-align: left; }
  .gross-big { display: flex; justify-content: space-between; align-items: baseline; margin-top: 1rem; padding: 1rem 1.25rem; background: var(--brand-soft); border-radius: var(--radius); }
  .gross-big span { color: var(--brand-dark); font-weight: 500; }
  .gross-big strong { font-size: 1.6rem; color: var(--brand-dark); font-variant-numeric: tabular-nums; }

  .actions { display: flex; gap: .75rem; justify-content: flex-end; flex-wrap: wrap; }

  /* MODAL */
  .backdrop { position: fixed; inset: 0; background: rgba(20,32,43,.55); display: none; align-items: center; justify-content: center; padding: 1rem; z-index: 100; }
  .backdrop.open { display: flex; }
  .modal { background: #fff; border-radius: 14px; width: 100%; max-width: 640px; max-height: 90vh; overflow: auto; padding: 1.75rem; }
  .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
  .modal-head h2 { font-size: 1.2rem; font-weight: 600; }
  .preview-meta { display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.25rem; font-size: 14px; }
  .preview-meta h3 { font-size: 12.5px; color: var(--muted); font-weight: 500; margin-bottom: .2rem; }
  .preview-table { width: 100%; border-collapse: collapse; font-size: 14px; margin-bottom: 1rem; font-variant-numeric: tabular-nums; }
  .preview-table th { text-align: right; font-size: 12.5px; color: var(--muted); font-weight: 500; padding: .4rem 0; border-bottom: 1px solid var(--line); }
  .preview-table td { text-align: right; padding: .5rem 0; border-bottom: 1px solid var(--line); }
  .preview-table th:first-child, .preview-table td:first-child { text-align: left; }
  .payload-label { font-size: 13px; color: var(--muted); margin: 1rem 0 .4rem; }
  pre.payload { background: #14202b; color: #d8e6ee; border-radius: 8px; padding: 1rem; font-size: 12px; overflow: auto; max-height: 220px; }

  .toast { position: fixed; bottom: 1.25rem; left: 50%; transform: translate(-50%, 20px); background: var(--ink); color: #fff; padding: .75rem 1.25rem; border-radius: 10px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; z-index: 200; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 760px) {
    .g3, .g2 { grid-template-columns: 1fr; }
    .items-head { display: none; }
    .item { grid-template-columns: 1fr 1fr; gap: .6rem; padding: 1rem 0; }
    .item .name { grid-column: 1 / -1; }
    .item .del { grid-column: 1 / -1; justify-self: end; }
    .item .net { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; }
    .m-label { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: .2rem; }
    .actions .btn { flex: 1; }
    .card { padding: 1.1rem; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="page">

  <div class="top">
    <div>
      <h1>Nowa faktura VAT</h1>
      <p>Wypełnij dane i pozycje. Kwoty liczą się automatycznie.</p>
    </div>
  </div>

  <form id="invoiceForm" novalidate>

    <section class="card">
      <h2>Dane faktury</h2>
      <div class="grid g3">
        <div class="field"><label for="number">Numer faktury</label><input id="number" name="number"></div>
        <div class="field"><label for="issueDate">Data wystawienia</label><input id="issueDate" type="date" required></div>
        <div class="field"><label for="dueDate">Termin płatności</label><input id="dueDate" type="date" required></div>
      </div>
    </section>

    <section class="card">
      <h2>Strony transakcji</h2>
      <div class="grid g2">
        <div class="grid">
          <div class="field"><label for="sellerName">Sprzedawca — nazwa</label><input id="sellerName" required autocomplete="organization"><span class="error"></span></div>
          <div class="field"><label for="sellerNip">Sprzedawca — NIP</label><input id="sellerNip" inputmode="numeric" placeholder="10 cyfr" required><span class="error"></span></div>
        </div>
        <div class="grid">
          <div class="field"><label for="buyerName">Nabywca — nazwa</label><input id="buyerName" required autocomplete="organization"><span class="error"></span></div>
          <div class="field"><label for="buyerNip">Nabywca — NIP</label><input id="buyerNip" inputmode="numeric" placeholder="10 cyfr" required><span class="error"></span></div>
        </div>
      </div>
    </section>

    <section class="card">
      <h2>Pozycje</h2>
      <div class="items-head" aria-hidden="true">
        <span>Nazwa</span><span class="r">Ilość</span><span class="r">Cena netto</span><span class="r">VAT</span><span class="r">Wartość netto</span><span></span>
      </div>
      <div id="items"></div>
      <button type="button" class="btn add" id="addItem">+ Dodaj pozycję</button>
    </section>

    <section class="card">
      <h2>Podsumowanie</h2>
      <table class="sum">
        <thead><tr><th scope="col">Stawka VAT</th><th scope="col">Netto</th><th scope="col">VAT</th><th scope="col">Brutto</th></tr></thead>
        <tbody id="sumBody"></tbody>
      </table>
      <div class="gross-big"><span>Do zapłaty</span><strong id="grossTotal">0,00 zł</strong></div>
    </section>

    <div class="actions">
      <button type="button" class="btn" id="resetBtn">Wyczyść</button>
      <button type="submit" class="btn primary">Podgląd i zapis</button>
    </div>
  </form>
</div>

<div class="backdrop" id="backdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal">
    <div class="modal-head">
      <h2 id="modalTitle">Podgląd faktury</h2>
      <button type="button" class="icon-btn" id="closeModal" aria-label="Zamknij">×</button>
    </div>
    <div id="previewBody"></div>
    <p class="payload-label">Dane w formacie JSON, gotowe do wysłania do API:</p>
    <pre class="payload" id="payload"></pre>
    <div class="actions" style="margin-top:1rem">
      <button type="button" class="btn" id="copyBtn">Kopiuj JSON</button>
      <button type="button" class="btn primary" id="saveBtn">Zapisz fakturę</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
  // ---------- helpers ----------
  const $ = (s, r = document) => r.querySelector(s);
  const VAT_OPTIONS = ['23', '8', '5', '0', 'zw'];
  const vatRate = v => (v === 'zw' ? 0 : Number(v));
  const vatLabel = v => (v === 'zw' ? 'zw.' : v + '%');

  // All money is kept in grosze (integers) to avoid floating point errors.
  const fmt = new Intl.NumberFormat('pl-PL', { style: 'currency', currency: 'PLN' });
  const money = gr => fmt.format(gr / 100);
  const toGr = n => Math.round(Number(n) * 100);

  function isoDate(d) { return d.toISOString().slice(0, 10); }
  function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
  function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }

  // Polish NIP checksum
  function validNip(raw) {
    const nip = raw.replace(/[\s-]/g, '');
    if (!/^\d{10}$/.test(nip)) return false;
    const w = [6, 5, 7, 2, 3, 4, 5, 6, 7];
    const sum = w.reduce((a, wt, i) => a + wt * Number(nip[i]), 0);
    const ctrl = sum % 11;
    return ctrl !== 10 && ctrl === Number(nip[9]);
  }

  // ---------- state ----------
  let items = [];
  let nextId = 1;
  const newItem = () => ({ id: nextId++, name: '', qty: 1, price: '', vat: '23' });

  const lineNet = it => {
    const qty = Number(it.qty), price = Number(it.price);
    if (!(qty > 0) || !(price >= 0) || it.price === '') return 0;
    return Math.round(qty * toGr(price));
  };

  // ---------- items UI ----------
  function renderItems() {
    const box = $('#items');
    box.innerHTML = '';
    items.forEach(it => {
      const row = document.createElement('div');
      row.className = 'item';
      row.dataset.id = it.id;
      row.innerHTML = `
        <div class="name"><span class="m-label">Nazwa</span><input data-f="name" placeholder="np. Usługa konsultingowa" value="${escapeHtml(it.name)}" aria-label="Nazwa pozycji"></div>
        <div><span class="m-label">Ilość</span><input data-f="qty" class="r" type="number" min="0" step="any" value="${it.qty}" aria-label="Ilość"></div>
        <div><span class="m-label">Cena netto</span><input data-f="price" class="r" type="number" min="0" step="0.01" placeholder="0,00" value="${it.price}" aria-label="Cena netto"></div>
        <div><span class="m-label">VAT</span><select data-f="vat" aria-label="Stawka VAT">${VAT_OPTIONS.map(v => `<option value="${v}"${v === it.vat ? ' selected' : ''}>${vatLabel(v)}</option>`).join('')}</select></div>
        <div class="net"><span class="m-label">Wartość netto</span><div class="line-net">${money(lineNet(it))}</div></div>
        <div class="del"><button type="button" class="icon-btn" data-del aria-label="Usuń pozycję"${items.length === 1 ? ' disabled' : ''}>×</button></div>`;
      box.appendChild(row);
    });
  }

  $('#items').addEventListener('input', e => {
    const row = e.target.closest('.item'); if (!row) return;
    const it = items.find(i => i.id === Number(row.dataset.id));
    it[e.target.dataset.f] = e.target.value;
    e.target.classList.remove('bad');
    row.querySelector('.line-net').textContent = money(lineNet(it));
    renderSummary();
  });

  $('#items').addEventListener('click', e => {
    const btn = e.target.closest('[data-del]'); if (!btn || items.length === 1) return;
    const id = Number(btn.closest('.item').dataset.id);
    items = items.filter(i => i.id !== id);
    renderItems(); renderSummary();
  });

  $('#addItem').addEventListener('click', () => {
    items.push(newItem());
    renderItems(); renderSummary();
    const last = $('#items').lastElementChild.querySelector('input');
    last.focus();
  });

  // ---------- summary ----------
  // VAT is calculated on the total net per rate (standard practice on Polish invoices).
  function totals() {
    const byRate = {};
    items.forEach(it => {
      const net = lineNet(it);
      if (!net) return;
      byRate[it.vat] = (byRate[it.vat] || 0) + net;
    });
    const rows = VAT_OPTIONS.filter(v => byRate[v] !== undefined).map(v => {
      const net = byRate[v];
      const vat = Math.round(net * vatRate(v) / 100);
      return { rate: v, net, vat, gross: net + vat };
    });
    const sum = k => rows.reduce((a, r) => a + r[k], 0);
    return { rows, net: sum('net'), vat: sum('vat'), gross: sum('gross') };
  }

  function renderSummary() {
    const t = totals();
    const body = $('#sumBody');
    if (!t.rows.length) {
      body.innerHTML = '<tr class="empty"><td colspan="4">Dodaj cenę i ilość, aby zobaczyć podsumowanie.</td></tr>';
    } else {
      body.innerHTML = t.rows.map(r => `<tr><td>${vatLabel(r.rate)}</td><td>${money(r.net)}</td><td>${money(r.vat)}</td><td>${money(r.gross)}</td></tr>`).join('') +
        `<tr class="total"><td>Razem</td><td>${money(t.net)}</td><td>${money(t.vat)}</td><td>${money(t.gross)}</td></tr>`;
    }
    $('#grossTotal').textContent = money(t.gross);
  }

  // ---------- validation ----------
  function setError(input, msg) {
    const f = input.closest('.field');
    f.classList.toggle('invalid', !!msg);
    const e = f.querySelector('.error'); if (e) e.textContent = msg || '';
    return !msg;
  }

  function validate() {
    let ok = true, first = null;
    const mark = (input, msg) => { const good = setError(input, msg); if (!good) { ok = false; first = first || input; } };

    ['sellerName', 'buyerName'].forEach(id => { const i = $('#' + id); mark(i, i.value.trim() ? '' : 'Podaj nazwę.'); });
    ['sellerNip', 'buyerNip'].forEach(id => {
      const i = $('#' + id);
      mark(i, !i.value.trim() ? 'Podaj NIP.' : (validNip(i.value) ? '' : 'Nieprawidłowy NIP — sprawdź cyfry.'));
    });

    const issue = $('#issueDate'), due = $('#dueDate');
    if (due.value && issue.value && due.value < issue.value) { ok = false; first = first || due; due.style.borderColor = 'var(--danger)'; showToast('Termin płatności nie może być przed datą wystawienia.'); }
    else due.style.borderColor = '';

    let itemsOk = false;
    document.querySelectorAll('.item').forEach(row => {
      const it = items.find(i => i.id === Number(row.dataset.id));
      const nameI = row.querySelector('[data-f=name]'), qtyI = row.querySelector('[data-f=qty]'), priceI = row.querySelector('[data-f=price]');
      const nameBad = !it.name.trim(), qtyBad = !(Number(it.qty) > 0), priceBad = it.price === '' || !(Number(it.price) >= 0);
      nameI.classList.toggle('bad', nameBad); qtyI.classList.toggle('bad', qtyBad); priceI.classList.toggle('bad', priceBad);
      if (nameBad || qtyBad || priceBad) { ok = false; first = first || (nameBad ? nameI : qtyBad ? qtyI : priceI); }
      else itemsOk = true;
    });
    if (!itemsOk && ok) { ok = false; showToast('Dodaj co najmniej jedną poprawną pozycję.'); }

    if (first) first.focus();
    return ok;
  }

  ['sellerName', 'buyerName', 'sellerNip', 'buyerNip'].forEach(id =>
    $('#' + id).addEventListener('input', e => setError(e.target, '')));

  // ---------- payload / preview ----------
  function buildPayload() {
    const t = totals();
    const cur = gr => Math.round(gr) / 100;
    return {
      number: $('#number').value.trim(),
      issueDate: $('#issueDate').value,
      dueDate: $('#dueDate').value,
      currency: 'PLN',
      seller: { name: $('#sellerName').value.trim(), nip: $('#sellerNip').value.replace(/\D/g, '') },
      buyer: { name: $('#buyerName').value.trim(), nip: $('#buyerNip').value.replace(/\D/g, '') },
      items: items.map(it => ({ name: it.name.trim(), quantity: Number(it.qty), unitNetPrice: Number(it.price), vatRate: it.vat, netTotal: cur(lineNet(it)) })),
      vatSummary: t.rows.map(r => ({ vatRate: r.rate, net: cur(r.net), vat: cur(r.vat), gross: cur(r.gross) })),
      totals: { net: cur(t.net), vat: cur(t.vat), gross: cur(t.gross) }
    };
  }

  let lastFocus = null;
  function openModal() {
    const p = buildPayload();
    $('#previewBody').innerHTML = `
      <div class="preview-meta">
        <div><h3>Faktura</h3><strong>${escapeHtml(p.number)}</strong><br>${p.issueDate} · termin: ${p.dueDate}</div>
        <div><h3>Sprzedawca</h3>${escapeHtml(p.seller.name)}<br>NIP ${p.seller.nip}</div>
        <div><h3>Nabywca</h3>${escapeHtml(p.buyer.name)}<br>NIP ${p.buyer.nip}</div>
      </div>
      <table class="preview-table">
        <thead><tr><th>Pozycja</th><th>Ilość</th><th>VAT</th><th>Netto</th></tr></thead>
        <tbody>${p.items.map(i => `<tr><td>${escapeHtml(i.name)}</td><td>${i.quantity}</td><td>${vatLabel(i.vatRate)}</td><td>${money(toGr(i.netTotal))}</td></tr>`).join('')}</tbody>
      </table>
      <div class="gross-big"><span>Do zapłaty</span><strong>${money(toGr(p.totals.gross))}</strong></div>`;
    $('#payload').textContent = JSON.stringify(p, null, 2);
    lastFocus = document.activeElement;
    $('#backdrop').classList.add('open');
    $('#closeModal').focus();
  }
  function closeModal() { $('#backdrop').classList.remove('open'); if (lastFocus) lastFocus.focus(); }

  $('#closeModal').addEventListener('click', closeModal);
  $('#backdrop').addEventListener('click', e => { if (e.target.id === 'backdrop') closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#backdrop').classList.contains('open')) closeModal(); });

  $('#invoiceForm').addEventListener('submit', e => { e.preventDefault(); if (validate()) openModal(); });

  $('#copyBtn').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText($('#payload').textContent); showToast('JSON skopiowany.'); }
    catch { showToast('Nie udało się skopiować. Zaznacz tekst ręcznie.'); }
  });

  $('#saveBtn').addEventListener('click', () => {
    // Backend hook: replace this with fetch('/api/invoices', { method: 'POST', body: JSON.stringify(buildPayload()) })
    console.log('POST /api/invoices', buildPayload());
    closeModal();
    showToast('Faktura zapisana (demo).');
  });

  // ---------- reset / init ----------
  function init() {
    const today = new Date();
    const m = String(today.getMonth() + 1).padStart(2, '0');
    $('#number').value = `FV/${today.getFullYear()}/${m}/001`;
    $('#issueDate').value = isoDate(today);
    $('#dueDate').value = isoDate(addDays(today, 14));
    ['sellerName', 'sellerNip', 'buyerName', 'buyerNip'].forEach(id => { $('#' + id).value = ''; setError($('#' + id), ''); });
    items = [newItem()];
    renderItems(); renderSummary();
  }
  $('#resetBtn').addEventListener('click', init);

  let toastTimer;
  function showToast(msg) {
    const t = $('#toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
  }

  init();
</script>
</body>
</html>
